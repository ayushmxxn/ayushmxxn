name: Waka Readme

on:
  schedule:
    # Runs at 12am IST
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate WakaTime card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          mkdir -p assets

          python <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from xml.sax.saxutils import escape

          api_key = os.environ["WAKATIME_API_KEY"]

          url = (
              "https://wakatime.com/api/v1/users/current/stats/all_time?"
              + urllib.parse.urlencode({"api_key": api_key})
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "ayushmxxn-github-readme"}
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)["data"]

          total = data.get("human_readable_total", "—")
          daily = data.get("human_readable_daily_average", "—")

          total = escape(total)
          daily = escape(daily)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="230"
            height="82"
            viewBox="0 0 230 82"
            role="img"
            aria-label="WakaTime coding statistics">

            <text
              x="0"
              y="16"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="11"
              font-weight="600"
              fill="#8b949e"
              letter-spacing="1">
              CODING
            </text>

            <text
              x="0"
              y="43"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="18"
              font-weight="600"
              fill="#e6edf3">
              {total}
            </text>

            <text
              x="0"
              y="64"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="11"
              fill="#8b949e">
              {daily} / day
            </text>

          </svg>
          '''

          with open("assets/wakatime.svg", "w", encoding="utf-8") as file:
              file.write(svg)
          PY

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: false
          SHOW_LINES_OF_CODE: true
          SHOW_PROFILE_VIEWS: false
          SHOW_TIMEZONE: false
          SHOW_LANGUAGE_PER_REPO: false
          SHOW_LOC_CHART: false
          SHOW_SHORT_INFO: false
          SHOW_COMMIT: false
          SHOW_DAYS_OF_WEEK: false
          SHOW_TOTAL_CODE_TIME: true
          SHOW_LANGUAGE: true
