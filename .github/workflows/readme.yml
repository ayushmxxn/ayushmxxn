name: Waka Readme

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate WakaTime card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          mkdir -p assets

          python <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from xml.sax.saxutils import escape

          api_key = os.environ["WAKATIME_API_KEY"]

          params = urllib.parse.urlencode({
              "api_key": api_key
          })

          url = f"https://wakatime.com/api/v1/users/current/stats/all_time?{params}"

          for attempt in range(3):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "ayushmxxn-github-readme"
                  }
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      data = json.load(response)["data"]
                  break

              except urllib.error.HTTPError as error:
                  if error.code == 202 and attempt < 2:
                      time.sleep(10)
                  else:
                      raise

          total = escape(
              data.get("human_readable_total", "—")
          )

          daily = escape(
              data.get("human_readable_daily_average", "—")
          )

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="230"
            height="76"
            viewBox="0 0 230 76"
            role="img"
            aria-label="WakaTime coding statistics">

            <title>
              {total} total coding time, {daily} daily average
            </title>

            <text
              x="0"
              y="15"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="10"
              font-weight="600"
              fill="#8b949e"
              letter-spacing="1">
              TOTAL TIME
            </text>

            <text
              x="0"
              y="39"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="18"
              font-weight="600"
              fill="#e6edf3">
              {total}
            </text>

            <text
              x="0"
              y="59"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
              font-size="11"
              fill="#8b949e">
              {daily} / day
            </text>

          </svg>'''

          with open(
              "assets/wakatime.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)
          PY

      - name: Commit WakaTime card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/wakatime.svg

          git diff --cached --quiet || \
            git commit -m "Update WakaTime stats"

          git push

      - name: Update README with WakaTime metrics
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: false
          SHOW_LINES_OF_CODE: true
          SHOW_PROFILE_VIEWS: false
          SHOW_TIMEZONE: false
          SHOW_LANGUAGE_PER_REPO: false
          SHOW_LOC_CHART: false
          SHOW_SHORT_INFO: false
          SHOW_COMMIT: false
          SHOW_DAYS_OF_WEEK: false
          SHOW_TOTAL_CODE_TIME: true
          SHOW_LANGUAGE: true
